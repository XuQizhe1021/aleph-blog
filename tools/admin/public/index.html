<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>博客管理</title>
		<script>
			(function () {
				var key = 'admin_theme';
				var read = function () {
					try {
						return localStorage.getItem(key);
					} catch (e) {
						return null;
					}
				};
				var stored = read();
				var prefersLight =
					window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
				var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
				document.documentElement.dataset.theme = theme;
				window.__ADMIN_SET_THEME__ = function (next) {
					document.documentElement.dataset.theme = next;
					try {
						localStorage.setItem(key, next);
					} catch (e) {}
				};
				window.__ADMIN_GET_THEME__ = function () {
					return document.documentElement.dataset.theme;
				};
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/vendor/katex/katex.min.css" />
		<link rel="stylesheet" href="/admin/styles.css" />
	</head>
	<body>
		<div class="shell">
			<header class="top">
				<div class="brand">博客管理</div>
				<div class="top-actions">
					<button class="btn theme-btn" id="theme-toggle" type="button" aria-label="切换明暗主题">
						<svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
						<svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" /></svg>
					</button>
					<label class="btn">
						上传文章(md)
						<input id="upload-md" type="file" accept=".md,.mdx" hidden />
					</label>
					<label class="btn">
						上传打赏图
						<input id="upload-reward" type="file" accept="image/*" hidden />
					</label>
					<button class="btn" id="manage-categories" type="button">分类管理</button>
					<button class="btn" id="publish" type="button">发布到GitHub</button>
					<button class="btn" id="refresh" type="button">刷新</button>
				</div>
			</header>
			<div class="main">
				<aside class="admin-nav panel" id="admin-nav">
					<div class="admin-nav-head">
						<div class="admin-nav-title">功能导航</div>
					</div>
					<nav class="admin-nav-list" aria-label="后台功能导航">
						<span class="nav-bubble" aria-hidden="true"></span>
						<button class="btn admin-nav-item active" type="button" data-tree-item data-admin-page="posts">
							<span class="nav-icon" aria-hidden="true">
								<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z" /><path d="M14 3v4h4" /></svg>
							</span>
							<span class="nav-label">文章管理</span>
						</button>
						<div class="tree-node" data-tree-node data-open="1">
							<button class="btn admin-nav-item tree-parent" type="button" data-tree-toggle>
								<span class="tree-arrow" aria-hidden="true">
									<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
								</span>
								<span class="nav-icon" aria-hidden="true">
									<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
								</span>
								<span class="nav-label">站点配置</span>
							</button>
							<div class="tree-children">
								<div class="tree-node" data-tree-node data-open="1">
									<button class="btn admin-nav-item tree-parent" type="button" data-tree-toggle>
										<span class="tree-arrow" aria-hidden="true">
											<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
										</span>
										<span class="nav-icon" aria-hidden="true">
											<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
										</span>
										<span class="nav-label">功能开关</span>
									</button>
									<div class="tree-children">
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="features" data-settings-group="features" data-settings-card="features-视觉微调">视觉微调</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="features" data-settings-group="features" data-settings-card="features-内容增强">内容增强</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="features" data-settings-group="features" data-settings-card="features-实用工具">实用工具</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="features" data-settings-group="features" data-settings-card="features-社交互动">社交互动</button>
									</div>
								</div>
								<div class="tree-node" data-tree-node data-open="1">
									<button class="btn admin-nav-item tree-parent" type="button" data-tree-toggle>
										<span class="tree-arrow" aria-hidden="true">
											<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
										</span>
										<span class="nav-icon" aria-hidden="true">
											<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2M4 7h16M4 7v12a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7" /><path d="M9 11h6M9 15h6" /></svg>
										</span>
										<span class="nav-label">文案与视觉</span>
									</button>
									<div class="tree-children">
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="texts" data-settings-group="texts" data-settings-card="texts-文案配置">文案配置</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="texts" data-settings-group="texts" data-settings-card="texts-视觉参数">视觉参数</button>
									</div>
								</div>
								<div class="tree-node" data-tree-node data-open="1">
									<button class="btn admin-nav-item tree-parent" type="button" data-tree-toggle>
										<span class="tree-arrow" aria-hidden="true">
											<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
										</span>
										<span class="nav-icon" aria-hidden="true">
											<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" /></svg>
										</span>
										<span class="nav-label">集成配置</span>
									</button>
									<div class="tree-children">
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="integrations" data-settings-group="integrations" data-settings-card="integrations-giscus">Giscus 评论</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="integrations" data-settings-group="integrations" data-settings-card="integrations-link-0">链接项 1</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="integrations" data-settings-group="integrations" data-settings-card="integrations-link-1">链接项 2</button>
										<button class="btn admin-nav-item tree-child" type="button" data-tree-item data-admin-page="settings" data-settings-tab="integrations" data-settings-group="integrations" data-settings-card="integrations-link-2">链接项 3</button>
									</div>
								</div>
							</div>
						</div>
					</nav>
				</aside>
				<section class="admin-pages">
					<section class="admin-page" data-admin-page-panel="posts">
						<div class="posts-layout">
							<aside class="left">
								<div class="panel left-panel">
									<input id="filter" class="input" placeholder="搜索标题 / slug / 分类…" />
									<div class="muted meta" id="count"></div>
								</div>
								<div class="list" id="list"></div>
							</aside>
							<div class="panel viewer">
								<div class="viewer-head">
									<div class="viewer-title" id="v-title">请选择一篇文章</div>
									<div class="viewer-actions">
										<button class="btn" id="open-site" type="button" disabled>在站点中打开</button>
										<button class="btn danger" id="delete" type="button" disabled>删除</button>
									</div>
								</div>
								<div class="muted viewer-sub" id="v-sub"></div>
								<div class="viewer-meta">
									<div class="row">
										<div class="label">分类</div>
										<div class="viewer-edit">
											<input
												class="input"
												id="edit-categories"
												placeholder="多个分类用逗号分隔，例如：技术, 随笔"
												disabled
											/>
											<button class="btn" id="save-categories" type="button" disabled>保存分类</button>
										</div>
										<div class="hint">留空=设为未分类（删除文章 frontmatter 的 categories 字段）。</div>
									</div>
								</div>
								<div class="split">
									<div class="raw">
										<div class="split-title muted">原始内容</div>
										<pre class="code" id="raw"></pre>
									</div>
									<div class="preview">
										<div class="split-title muted">预览</div>
										<div class="prose" id="preview"></div>
									</div>
								</div>
							</div>
						</div>
					</section>
					<section class="admin-page" data-admin-page-panel="settings" hidden>
						<div class="panel settings-center">
							<div class="viewer-head">
								<div class="viewer-title">站点配置中心</div>
								<div class="viewer-actions">
									<button class="btn" id="settings-preview" type="button">预览配置</button>
									<button class="btn" id="settings-save" type="button">保存草稿</button>
									<button class="btn" id="settings-publish" type="button">发布生效</button>
								</div>
							</div>
							<div class="muted viewer-sub" id="settings-meta">加载中...</div>
							<div class="settings-panel" id="settings-single"></div>
						</div>
					</section>
				</section>
			</div>
		</div>
		<div class="modal" id="modal" hidden>
			<div class="modal-backdrop" id="modal-backdrop" aria-hidden="true"></div>
			<div class="modal-panel panel" role="dialog" aria-modal="true" aria-label="对话框">
				<div class="modal-head">
					<div class="modal-title" id="modal-title"></div>
					<button class="btn" id="modal-close" type="button">关闭</button>
				</div>
				<div class="modal-body" id="modal-body"></div>
				<div class="modal-actions" id="modal-actions"></div>
			</div>
		</div>
		<script type="module" src="/admin/app.js"></script>
	</body>
</html>
